name: Deploy iOS to App Store
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
          - none
      export_ipa:
        description: "Export IPA as artifact"
        required: false
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

jobs:
  deploy:
    runs-on: macos-latest

    env:
      GRADLE_OPTS: -Xmx6g
      _JAVA_OPTIONS: -Xmx6g
      APP_IDENTIFIER: 'com.tstudioz.fax.fme'
      GIT_URL: 'git@github.com:stipe-jurkovic/FCAppleAppKeys.git'
      GIT_BRANCH: 'main'
      MATCH_TYPE: 'appstore'
      PROVISIONING_PROFILE_NAME: 'match AppStore com.tstudioz.fax.fme 1779911279'
      METADATA_PATH: './fastlane/metadata'
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      AUTH_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      EXPORT_IPA: ${{ inputs.export_ipa }}

    steps:
      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build KMP (Gradle step)
        run: |
          ./gradlew clean
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Set up Ruby (with Bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Fastlane and dependencies
        working-directory: iosApp
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Set up SSH for Fastlane Match
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/match_ci_key
          chmod 600 ~/.ssh/match_ci_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf "Host github.com\n  IdentityFile ~/.ssh/match_ci_key\n  StrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Decode and save App Store Connect API key
        working-directory: iosApp
        run: |
          mkdir -p secrets
          echo "$AUTH_KEY_BASE64" | base64 --decode > secrets/Auth_key.p8
      
      - name: Run Fastlane release lane
        working-directory: iosApp
        run: |
          bundle exec fastlane ios release \
            app_identifier:"$APP_IDENTIFIER" \
            git_url:"$GIT_URL" \
            git_branch:"$GIT_BRANCH" \
            match_type:"$MATCH_TYPE" \
            provisioning_profile_name:"$PROVISIONING_PROFILE_NAME" \
            metadata_path:"$METADATA_PATH" \
            appstore_key_id:"$APPSTORE_KEY_ID" \
            appstore_issuer_id:"$APPSTORE_ISSUER_ID" \
            match_password:"$MATCH_PASSWORD" \
            git_private_key:"$HOME/.ssh/match_ci_key" \
            key_filepath:"secrets/Auth_key.p8"
      - name: Upload IPA artifact
        if: ${{ inputs.export_ipa == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: iosApp/build/iosApp.ipa
