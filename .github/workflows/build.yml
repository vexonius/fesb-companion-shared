name: Shared.xcframework debug release

on:
  push:
    branches: ["main", "develop"]
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Build new release
        run: |
          chmod +x gradlew 
          ./gradlew assembleXCFramework
          mv shared/build/XCFrameworks/debug/shared.xcframework shared.xcframework
          zip -r shared.xcframework.zip shared.xcframework
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: "true"
          name: "0.1.2"
          tag: "debug"
          makeLatest: "true"
          artifacts: "shared.xcframework.zip"
